name: Preview video (onizleme, yuklemez)

# Elle tetiklenir. Secilen branch'teki kodla TEK bir ornek video uretir ve
# Telegram'a "ONIZLEME" olarak gonderir. State commit edilmez, Telegram
# offset'i okunmaz/degismez, YouTube'a yukleme yapilmaz -> canli akis etkilenmez.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bagimliliklari kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Onizleme videosu uret ve Telegram'a gonder
        working-directory: src
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CONTENT_LANGUAGE: "en"
          TTS_VOICE: "en-US-AriaNeural"
        run: python preview.py
