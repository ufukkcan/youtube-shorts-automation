name: Check Telegram selection and produce

on:
  schedule:
    # Her 5 dakikada bir kontrol eder. Bekleyen is yoksa hemen biter.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch: {}

concurrency:
  group: check-and-produce
  cancel-in-progress: false

jobs:
  check-and-produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: ffmpeg apt paketlerini onbellekle
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-ffmpeg-${{ runner.os }}-v1

      - name: Bagimliliklari kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Secimi kontrol et, varsa uret ve yukle
        working-directory: src
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY_STATUS: "public"
          CONTENT_LANGUAGE: "en"
          TTS_VOICE: "en-US-AriaNeural"
          AUTO_TRIGGER_TIME: "16:30"
          PUBLISH_TIME_ISTANBUL: "20:00"
          FALLBACK_HOURS: "20"
          MAX_REDO_ATTEMPTS: "5"
        run: python check_and_produce.py

      - name: State kaydet
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/
          git diff --quiet --cached || git commit -m "State guncellendi (secim/uretim)"
          git push
