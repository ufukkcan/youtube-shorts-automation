name: Check Telegram selection and produce
on:
  schedule:
    # Her 5 dakikada bir kontrol eder. Bekleyen secim yoksa hemen biter, is yapmaz.
     - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch: {}
concurrency:
  group: check-and-produce
  cancel-in-progress: false  # uretim suren bir calisma varsa yenisi onu iptal etmesin, sirada beklesin
jobs:
  check-and-produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"  # pip paketlerini onbellekler, sonraki calistirmalari hizlandirir
      - name: ffmpeg apt paketlerini onbellekle
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-ffmpeg-${{ runner.os }}-v1
      - name: Bagimliliklari kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
      - name: Secimi kontrol et, varsa uret ve yukle
        working-directory: src
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: "SELF_ONLY"  # uygulaman TikTok tarafindan onaylanana kadar boyle kalsin, sonra "PUBLIC_TO_EVERYONE" yap
          CONTENT_LANGUAGE: "tr"
          TTS_VOICE: "tr-TR-EmelNeural"  # diger secenekler: en-US-GuyNeural, en-US-AndrewNeural, en-GB-SoniaNeural
          AUTO_TRIGGER_TIME: "16:30"      # "video uret" yazilmazsa gunun dongusu bu Istanbul saatinde kendiliginden baslar
          PUBLISH_TIME_ISTANBUL: "20:00"  # onaylanan video her gun bu Istanbul saatinde otomatik yayina girer (onay saatinden bagimsiz). Kapatmak icin "off" yap.
          FALLBACK_HOURS: "20"       # yanit gelmezse kac saat sonra otomatik ilerlesin (secim/onay). Kapatmak icin 0 yap.
          MAX_REDO_ATTEMPTS: "5"     # "tekrar uret" ile en fazla kac deneme yapilsin, sonra otomatik onaylanir
        run: python check_and_produce.py
      - name: State kaydet
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/
          git diff --quiet --cached || git commit -m "State guncellendi (secim/uretim)"
          git push
