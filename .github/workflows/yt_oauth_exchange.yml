name: YouTube OAuth code exchange (tek seferlik yardimci)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Tarayicidan aldigin 'code' degeri"
        required: true

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - working-directory: src
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_AUTH_CODE: ${{ github.event.inputs.code }}
        run: python yt_oauth_exchange.py
